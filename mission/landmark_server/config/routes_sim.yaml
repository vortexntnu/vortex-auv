# Way points between tasks for the simulator course, on top of
# landmark_server.yaml's targets. One file per course; the launch file picks
# it with env, or routes_file.
/**:
  ros__parameters:
    targets:
      # Around the slalom on its left, for when it fails half way and on the
      # way home: straight lines between tasks must not cross it.
      around_start: {parents: ["prior_slalom/corrected"], x: -2.5, y: -4.0, z: 0.1}   # clear of the gate's left post too
      around_end: {parents: ["prior_slalom/corrected"], x: 4.0, y: -4.0, z: 0.1}
      # The way home from the torpedo board, the last task: where it ends,
      # facing home, beside the board, around_end past the slalom, then in
      # front of the gate. Each point hangs on the object it is nearest, so a
      # moved task only moves its own points. GoToFrame drives along the
      # target's X first, then its Y: each of those legs must be clear.
      leave: {parents: ["torpedo_board", "torpedo_board/measured"], x: 3.0, yaw: 101.0}
      home_0: {parents: ["torpedo_board", "torpedo_board/measured"], x: 3.0, y: 3.21, z: -0.15}   # beside the board, clear of it on the way back
      home_gate: {parents: ["gate_search_rescue", "gate_search_rescue/measured"], x: 1.14, y: -3.42, z: 1.07}
