# drift_injector: a STIM300 + DVL estimator working as it should.
# Gyro numbers from the STIM300 datasheet; DVL numbers are typical values.
drift_injector:
  ros__parameters:
    drift_yaw_deg_per_m: 0.0
    gyro_bias_deg_per_h: 3.0         # bias left after the filter's estimate
    earth_rate_deg_per_h: 0.0        # the filter compensates Earth rotation
    gyro_gm_std_deg_per_h: 0.5       # bias instability
    gyro_gm_tau_s: 600.0
    gyro_arw_deg_per_sqrt_h: 0.15    # angle random walk
    scale_error: 0.005               # DVL scale
    dvl_misalignment_deg: 0.5        # DVL-IMU mounting yaw
    dvl_pos_rw_m_per_sqrt_s: 0.01    # DVL velocity noise
    noise: true
