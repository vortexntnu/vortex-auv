/**:
  ros__parameters:
    target_frame: "nautilus/odom"
    timer_rate_ms: 200

    track_config:
      default:
        nm:
          confirm_n: 3 # hits needed for confirmation
          confirm_m: 5 # window size for confirmation
          delete_n: 5  # misses needed for deletion
          delete_m: 7  # window size for deletion

        gate:
          min_pos_error: 0.0 # in meters
          max_pos_error: 0.5 # in meters
          min_ori_error: 0.0 # in radians
          max_ori_error: 0.5 # in radians

        dyn_mod_std_dev: 0.2
        sens_mod_std_dev: 0.2

        init_pos_std_dev: 0.1
        init_ori_std_dev: 0.05

        mahalanobis_gate_threshold: 2.5 # in std deviations
        prob_of_detection: 0.5
        clutter_intensity: 0.01

    topics:
      object_map: "landmark_server/object_map"
      live_tracks: "landmark_server/live_tracks"
      course_frame_state: "landmark_server/course_frame_state"

    intake:
      max_pipe_distance_m: 7.0             # pipes farther away are discarded
      no_orientation_rot_variance: 1000.0  # rotation variance >= this = no orientation
      # Extra measurement variance [m^2] = base + per_meter * distance from the
      # vehicle: far detections weigh less in the tracker.
      distance_noise: {base_variance: 0.0, variance_per_meter: 0.005}

    # Course frame: TF nautilus/course (child of target_frame).
    # x through the gate, y to the right, z down. Lane limits are in this frame
    # (estimates, to be measured in the pool).
    course_frame:
      publish_tf: true
      frame_id: "nautilus/course"
      gate_lock: {consistent_estimates: 10, max_yaw_std_deg: 3.0}
      warn_start_vs_gate_deg: 30.0
      lane:
        before_gate: {x: [-10.0, 45.0], y: [-12.0, 12.0]}
        after_gate: {x: [-5.0, 40.0], y: [-6.0, 6.0]}

    # Map rules per class.
    # max_instances is per (type, subtype). retain: forever, or retain_sec.
    classes:
      GATE: {max_instances: 1, retain: forever}
      SLALOM_PIPE:
        max_instances: {WHITE: 10, RED: 5}
        instance_gate_m: 0.7
        retain_sec: 15.0
        keep_after_observations: 30
        min_distance_to_large_structures_m: 1.5
      PATH_MARKER: {max_instances: 2, retain_sec: 15.0}
      TORPEDO_BOARD: {max_instances: 1, retain: forever}
      BIN: {max_instances: 4, instance_gate_m: 0.25, retain_sec: 15.0}
      TABLE: {max_instances: 1, retain: forever}
      OCTAGON: {max_instances: 1, retain: forever}

    rules:
      plausibility_radius_m: 3.0
      large_structures: [GATE, TABLE, TORPEDO_BOARD, BIN_STRUCTURE]
      gate_yaw_from_panels: true      # normal on the line between the panels
      board_yaw_from_icons: true      # normal on the icon pairs
      bin_role_from_down_icons: true  # role icon from the down camera -> nearest bin
      octagon_from_table: true        # OCTAGON_WHOLE over the table
      yaw_lock: {consistent_estimates: 5, max_jump_deg: 90.0}
      # Objects on the floor or at the surface get that depth (odom z, down
      # positive) instead of the measured one; the octagon floats at the
      # surface. The depths are the simulator's pool, measure them for the
      # real pool.
      z_lock:
        enable: true
        floor_z: 3.432
        surface_z: 0.0
        floor_classes: [TABLE, PATH_MARKER, BIN_STRUCTURE]
        surface_classes: [OCTAGON]
      # Board frame: +X out of the front, +Y right, +Z down. Offsets from an
      # icon to its opening, per board version (fire above blood = version 1).
      # Placeholder values, to be measured on our own board.
      torpedo_targets_from_icons:
        version_1: {fire: [0.0, 0.0, -0.169], blood: [0.0, 0.0, -0.169],
                    firetruck: [0.0, 0.1888, 0.0], ambulance: [0.0, -0.192, 0.0]}
        version_2: {fire: [0.0, 0.0, -0.218], blood: [0.0, 0.0, -0.168],
                    firetruck: [0.0, -0.1555, -0.15], ambulance: [0.0, 0.193, 0.0]}

    debug:
      enable: false
      topic_name: "landmark_server/debug/landmark_tracks"
      landmark_pose_topic: "landmark_server/debug/landmark_pose"
      landmark_type: 0     # 0 = any type
      landmark_subtype: 0  # 0 = any subtype
