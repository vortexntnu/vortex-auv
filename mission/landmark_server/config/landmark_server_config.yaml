# landmark_server: the settings that are the same in every pool. Everything
# not listed here has a default in the code (README, "All settings").
#
# The files, loaded in this order by the launch file (later files win):
#   landmark_server_config.yaml  this file: tracker and map behaviour
#   markers.yaml                 how the map is drawn in Foxglove (no tuning)
#   <env>.yaml                   measured in that pool: floor, detector noise, drift
#   course/templates.yaml        what each RoboSub prop looks like
#   course/<env>.yaml            where the tasks are in that pool
/**:
  ros__parameters:
    target_frame: "nautilus/odom"

    # The tracker (pose_filtering). Read at start.
    track_config:
      default:
        # A track is confirmed after confirm_n hits in confirm_m ticks
        # (5 Hz), deleted after delete_n misses in delete_m ticks.
        nm: {confirm_n: 3, confirm_m: 5, delete_n: 5, delete_m: 7}
        # A detection farther than this from a track is not that track [m].
        # A camera's depth error at 6-7 m reaches 0.6 m: smaller values split
        # one object into several tracks.
        gate: {max_pos_error: 1.5}
        # How much a track may move per tick, and the class noise of a
        # detection [m] (the detector noise of <env>.yaml comes on top).
        dyn_mod_std_dev: 0.2
        sens_mod_std_dev: 0.2

      # Pipes stand at least 1.5 m apart. A detection within 0.5 m of a pipe
      # track is that pipe; one that goes to no track does not start a new
      # pipe within 0.7 m of another. 5 hits in 7 ticks to confirm: clutter
      # next to a pipe could otherwise take its detections and get confirmed.
      SLALOM_PIPE:
        nm: {confirm_n: 5, confirm_m: 7}
        gate: {min_pos_error: 0.5}
        new_track_min_distance_m: 0.7

    # Drift correction (iSAM2): vehicle keyframes and landmarks in one graph.
    # The drift values are measured per pool (<env>.yaml). Read at start.
    graph:
      enable: true

    # Classes that are no part of a course task (course/templates.yaml) are
    # free landmarks: kept retain_sec after the last detection, at most
    # max_instances of each. Classes not listed: 20, 15 s.
    classes:
      PATH_MARKER: {max_instances: 2}
      # Moved during the run: followed live only (landmark_server/live_tracks),
      # never a landmark in the map.
      TABLE_ITEM_NUTBOLT: {live_only: true}
      TABLE_ITEM_ELECTRIC: {live_only: true}
      TABLE_ITEM_PILL: {live_only: true}
      TABLE_ITEM_BANDAID: {live_only: true}

    rules:
      # Objects on the floor or at the surface get that depth instead of the
      # measured one (enable and the depths are in <env>.yaml). The table is
      # not locked: its top is ~0.7 m above the floor.
      z_lock:
        floor_classes: [PATH_MARKER, BIN_STRUCTURE]
        surface_classes: [OCTAGON_WHOLE]
