# Topics come from auv_setup's robot file, premap_file from the launch file.
# env:=sim loads sim.yaml on top. Write floats with a decimal point.
/**:
  ros__parameters:
    # A new keyframe is made after this distance or time.
    keyframe_dist_m: 0.5
    keyframe_time_s: 1.0
    max_messages_per_keyframe: 5   # per source, newest first
    max_range_m: 10.0              # detections beyond this are dropped

    # Odometry noise per keyframe step. Too small and loop closures get
    # rejected, too large and the map ignores the odometry.
    odom:
      sigma_trans_per_m: 0.03   # [m per m]
      # 0.01 broke the map at 0.5 deg/m of yaw drift, 0.03 held to 1 deg/m.
      sigma_yaw_per_m: 0.03     # [rad per m]
      min_sigma_trans: 0.01     # [m]
      min_sigma_yaw: 0.002      # [rad]
      sigma_roll_pitch: 0.01    # [rad]
      sigma_z: 0.02             # [m]
      attitude_sigma: 0.02      # IMU roll/pitch [rad]
      depth_sigma: 0.05         # pressure sensor [m]

    # sigma_range = a + b * range. Check with the landmark_server/nis topic:
    # it should stay near 1. Much higher means these are too small.
    detection:
      bearing_sigma: 0.03                  # [rad]
      range_sigma_a: 0.1                   # [m]
      range_sigma_b: 0.05
      orientation_yaw_sigma: 0.1           # [rad]
      orientation_roll_pitch_sigma: 0.5    # [rad]
      dcs_phi: 1.0                         # robust kernel, smaller = stricter
      max_merged_per_factor: 4

    association:
      gate_prob: 0.999     # chi^2 gate, 3 dof
      ambiguity_d2: 4.6    # drop a match if a second landmark is this close

    # confirm_hits detections within candidate_radius_m and confirm_window_s
    # make a new landmark.
    new_landmarks:
      candidate_radius_m: 0.5   # under half the spacing of same-class objects
      confirm_hits: 5
      confirm_window_s: 3.0

    upkeep:
      merge_radius_m: 0.5   # same-class landmarks this close are merged

    # Target frames, see "Target frames" in the README. An empty class name
    # turns a block off.
    gate:
      panel_classes: ["gate_search_rescue", "gate_survey_repair"]
      min_separation_m: 0.2
      max_separation_m: 2.5
      approach_m: 1.0
      depth_below_panel_m: 0.5

    slalom:
      red_class: "slalom_pipe_red"
      white_class: "slalom_pipe_white"
      nominal_spacing_m: 1.52   # red to white pipe in a row
      row_spacing_m: 2.0
      min_spacing_m: 0.8        # a white pipe belongs to a row between
      max_spacing_m: 2.3        # these distances from its red pipe

    # [y, z] from the board centre seen from the front, y right, z down.
    # Can be changed while running with ros2 param set.
    torpedo:
      board_class: "torpedo_board"
      openings:
        large_left: [-0.210, -0.064]
        large_right: [0.214, 0.216]
        small_top: [-0.003, -0.192]
        small_bottom: [-0.006, 0.200]

    # type, subtype    vortex_msgs LandmarkType / LandmarkSubtype constants
    # symmetry_deg     0 none, 90 or 180 yaw known modulo this, 360 no yaw
    # has_orientation  use the detector's orientation
    # prior            task label in the prior map, "" for none
    # prior_radius_m   used when the prior map has no radius for the task
    # max_instances    landmarks shown, 0 = all
    # group            classes that can be mistaken for each other
    classes:
      gate_search_rescue: {type: GATE, subtype: GATE_SEARCH_RESCUE, symmetry_deg: 0.0, has_orientation: true, prior: "gate", prior_radius_m: 3.0, max_instances: 1}
      gate_survey_repair: {type: GATE, subtype: GATE_SURVEY_REPAIR, symmetry_deg: 0.0, has_orientation: true, prior: "gate", prior_radius_m: 3.0, max_instances: 1}
      gate: {type: GATE, subtype: GATE_WHOLE, symmetry_deg: 180.0, has_orientation: true, prior: "gate", prior_radius_m: 3.0, max_instances: 1}
      gate_pole_edge: {type: GATE, subtype: GATE_POLE_EDGE, symmetry_deg: 360.0, has_orientation: false, prior: "gate", prior_radius_m: 3.0, max_instances: 2}
      gate_pole_middle: {type: GATE, subtype: GATE_POLE_MIDDLE, symmetry_deg: 360.0, has_orientation: false, prior: "gate", prior_radius_m: 3.0, max_instances: 1}
      slalom_pipe_white: {type: SLALOM_PIPE, subtype: SLALOM_PIPE_WHITE, symmetry_deg: 360.0, has_orientation: false, prior: "slalom", prior_radius_m: 4.0, max_instances: 6, group: "slalom_pipe"}
      slalom_pipe_red: {type: SLALOM_PIPE, subtype: SLALOM_PIPE_RED, symmetry_deg: 360.0, has_orientation: false, prior: "slalom", prior_radius_m: 4.0, max_instances: 3, group: "slalom_pipe"}
      torpedo_board: {type: TORPEDO_BOARD, subtype: TORPEDO_BOARD_WHOLE, symmetry_deg: 0.0, has_orientation: true, prior: "torpedo", prior_radius_m: 3.0, max_instances: 1}
      torpedo_icon_fire: {type: TORPEDO_BOARD, subtype: TORPEDO_ICON_FIRE, symmetry_deg: 0.0, has_orientation: true, prior: "torpedo", prior_radius_m: 3.0, max_instances: 1}
      torpedo_icon_blood: {type: TORPEDO_BOARD, subtype: TORPEDO_ICON_BLOOD, symmetry_deg: 0.0, has_orientation: true, prior: "torpedo", prior_radius_m: 3.0, max_instances: 1}
      torpedo_icon_firetruck: {type: TORPEDO_BOARD, subtype: TORPEDO_ICON_FIRETRUCK, symmetry_deg: 0.0, has_orientation: true, prior: "torpedo", prior_radius_m: 3.0, max_instances: 1}
      torpedo_icon_ambulance: {type: TORPEDO_BOARD, subtype: TORPEDO_ICON_AMBULANCE, symmetry_deg: 0.0, has_orientation: true, prior: "torpedo", prior_radius_m: 3.0, max_instances: 1}
      bin_search_rescue: {type: BIN, subtype: BIN_SEARCH_RESCUE, symmetry_deg: 180.0, has_orientation: true, prior: "bin", prior_radius_m: 3.0, max_instances: 2}
      bin_survey_repair: {type: BIN, subtype: BIN_SURVEY_REPAIR, symmetry_deg: 180.0, has_orientation: true, prior: "bin", prior_radius_m: 3.0, max_instances: 2}
      bin_structure: {type: BIN, subtype: BIN_STRUCTURE, symmetry_deg: 180.0, has_orientation: true, prior: "bin", prior_radius_m: 3.0, max_instances: 1}
      path_marker: {type: PATH_MARKER, subtype: PATH_MARKER_WHOLE, symmetry_deg: 0.0, has_orientation: true, prior: "", prior_radius_m: 5.0, max_instances: 0}
      table: {type: TABLE, subtype: TABLE_WHOLE, symmetry_deg: 180.0, has_orientation: true, prior: "octagon", prior_radius_m: 3.0, max_instances: 1}
      octagon: {type: OCTAGON, subtype: OCTAGON_WHOLE, symmetry_deg: 360.0, has_orientation: false, prior: "octagon", prior_radius_m: 3.0, max_instances: 1}
