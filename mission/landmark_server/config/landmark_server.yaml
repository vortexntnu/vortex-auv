# Topics come from auv_setup's robot file, premap_file from the launch file.
# Write floats with a decimal point.
/**:
  ros__parameters:
    max_range_m: 10.0   # detections farther from the vehicle are dropped

    # Every detection is stored in odom, the newest max_hits_per_class per
    # class. Twice a second each group is clustered: the densest hit and
    # those within cluster_radius_m are one landmark if there are at least
    # confirm_hits, then the next.
    map:
      cluster_radius_m: 0.5      # under half the spacing of same-group objects
      confirm_hits: 5
      max_hits_per_class: 500
      max_hit_age_s: 0.0         # forget older hits, 0 keeps them all

    # Defaults for the measure action, when the goal gives 0. Only hits that
    # arrive during the action and within max_range_m of the vehicle count.
    measure:
      duration_s: 5.0
      max_range_m: 4.0
      min_hits: 5
      max_spread_m: 0.3
      # class "slalom": rows this far apart, from the first in front on
      slalom_rows: 3
      slalom_spacing_m: 2.0

    # prior_<task>/corrected is the prior in odom. Enabled, every prior moves
    # by how far the last measured task was from its own prior: the drift
    # since the start drops out, but an eyeballed prior moves the others.
    prior_offset:
      enabled: false

    # <parent>/<name> for every parent that exists in TF, offset in the
    # parent's axes: x, y, z [m], roll, pitch, yaw [deg]. ros2 param set
    # works while running. Objects with a front (board, bins, table) have
    # +X out of the front, so in front of them is +x, facing them yaw 180.
    # slalom_row/measured has +X through the row, +Y right, from its red
    # pipe. Numbers are placeholders from the simulator course.
    targets:
      entry: {parents: ["gate_middle", "gate_search_rescue/measured", "gate_survey_repair/measured"], x: -1.5, z: 0.8}   # clear of the gate's centre pole
      exit: {parents: ["gate_middle", "gate_search_rescue/measured", "gate_survey_repair/measured"], x: 1.5, z: 0.8}
      gap_left_entry: {parents: ["slalom_row/measured", "slalom_row/measured/next", "slalom/refined", "slalom/measured/row0", "slalom/measured/row1", "slalom/measured/row2"], x: -1.0, y: -0.75}
      gap_left_exit: {parents: ["slalom_row/measured", "slalom_row/measured/next", "slalom/refined", "slalom/measured/row0", "slalom/measured/row1", "slalom/measured/row2"], x: 1.0, y: -0.75}
      gap_right_entry: {parents: ["slalom_row/measured", "slalom_row/measured/next", "slalom/refined", "slalom/measured/row0", "slalom/measured/row1", "slalom/measured/row2"], x: -1.0, y: 0.75}
      gap_right_exit: {parents: ["slalom_row/measured", "slalom_row/measured/next", "slalom/refined", "slalom/measured/row0", "slalom/measured/row1", "slalom/measured/row2"], x: 1.0, y: 0.75}
      next: {parents: ["slalom_row/measured"], x: 2.0}   # rows are 2 m apart
      standoff: {parents: ["torpedo_board", "torpedo_board/measured", "table", "table/measured"], x: 2.0, yaw: 180.0}
      shoot: {parents: ["torpedo_opening_large_left", "torpedo_opening_large_right", "torpedo_opening_small_top", "torpedo_opening_small_bottom", "torpedo_opening_large_left/measured", "torpedo_opening_large_right/measured", "torpedo_opening_small_top/measured", "torpedo_opening_small_bottom/measured"], x: 0.4, yaw: 180.0, tool: "grip_point"}
      above: {parents: ["bin_structure", "bin_structure/measured", "bin_search_rescue", "bin_survey_repair", "table", "table/measured"], z: -1.0}
      centre: {parents: ["octagon", "octagon/measured"], z: 0.5}
      home: {parents: ["start"]}
      # Where each task's search starts. On a class frame it follows the
      # object as soon as it is seen; until then the class frame is its prior.
      search_gate: {parents: ["gate_search_rescue"], x: -2.5, z: 0.6}
      search_slalom: {parents: ["prior_slalom/corrected"], x: -4.0, y: -0.9, z: 0.1}
      search_torpedo: {parents: ["torpedo_board"], x: 3.0, yaw: 180.0}
      # Around the slalom on its left, for when it fails half way: straight
      # lines between tasks must not cross it.
      around_start: {parents: ["prior_slalom/corrected"], x: -4.0, y: -4.0, z: 0.1}
      around_end: {parents: ["prior_slalom/corrected"], x: 4.0, y: -4.0, z: 0.1}

    # Gate target frames. Empty panel_classes turns them off.
    gate:
      panel_classes: ["gate_search_rescue", "gate_survey_repair"]
      min_separation_m: 0.2
      max_separation_m: 2.5
      approach_m: 1.0
      depth_below_panel_m: 0.5

    # Real-size boxes in the debug markers, sizes from the simulator's meshes.
    # size: [x out of the front, y right, z down], offset: box centre from
    # the landmark, solid: draw the object itself instead of an outline.
    markers:
      boxes:
        slalom_pipe_white: {size: [0.03, 0.03, 0.938], solid: true, color: [1.0, 1.0, 1.0]}
        slalom_pipe_red: {size: [0.03, 0.03, 0.938], solid: true, color: [1.0, 0.0, 0.0]}
        torpedo_board: {size: [0.05, 0.61, 0.61]}
        bin_structure: {size: [1.40, 1.45, 0.69]}
        table: {size: [0.61, 1.12, 0.77], offset: [0.0, 0.0, 0.33]}
        octagon: {size: [2.73, 2.73, 0.44], offset: [0.0, 0.0, 0.20]}

    # type, subtype    vortex_msgs LandmarkType / LandmarkSubtype constants
    # symmetry_deg     0 none, 90 or 180 yaw known modulo this, 360 no yaw
    # has_orientation  use the detector's orientation
    # prior            task label in the prior map, "" for none
    # prior_radius_m   used when the prior map has no radius for the task
    # max_instances    landmarks shown, 0 = all
    # group            classes that can be mistaken for each other
    classes:
      gate_search_rescue: {type: GATE, subtype: GATE_SEARCH_RESCUE, symmetry_deg: 0.0, has_orientation: true, prior: "gate", prior_radius_m: 3.0, max_instances: 1}
      gate_survey_repair: {type: GATE, subtype: GATE_SURVEY_REPAIR, symmetry_deg: 0.0, has_orientation: true, prior: "gate", prior_radius_m: 3.0, max_instances: 1}
      slalom_pipe_white: {type: SLALOM_PIPE, subtype: SLALOM_PIPE_WHITE, symmetry_deg: 360.0, has_orientation: false, prior: "slalom", prior_radius_m: 4.0, max_instances: 6, group: "slalom_pipe"}
      slalom_pipe_red: {type: SLALOM_PIPE, subtype: SLALOM_PIPE_RED, symmetry_deg: 360.0, has_orientation: false, prior: "slalom", prior_radius_m: 4.0, max_instances: 3, group: "slalom_pipe"}
      torpedo_board: {type: TORPEDO_BOARD, subtype: TORPEDO_BOARD_WHOLE, symmetry_deg: 0.0, has_orientation: true, prior: "torpedo", prior_radius_m: 3.0, max_instances: 1}
      torpedo_opening_large_left: {type: TORPEDO_BOARD, subtype: TORPEDO_OPENING_LARGE_LEFT, symmetry_deg: 0.0, has_orientation: true, prior: "torpedo", prior_radius_m: 3.0, max_instances: 1}
      torpedo_opening_large_right: {type: TORPEDO_BOARD, subtype: TORPEDO_OPENING_LARGE_RIGHT, symmetry_deg: 0.0, has_orientation: true, prior: "torpedo", prior_radius_m: 3.0, max_instances: 1}
      torpedo_opening_small_top: {type: TORPEDO_BOARD, subtype: TORPEDO_OPENING_SMALL_TOP, symmetry_deg: 0.0, has_orientation: true, prior: "torpedo", prior_radius_m: 3.0, max_instances: 1}
      torpedo_opening_small_bottom: {type: TORPEDO_BOARD, subtype: TORPEDO_OPENING_SMALL_BOTTOM, symmetry_deg: 0.0, has_orientation: true, prior: "torpedo", prior_radius_m: 3.0, max_instances: 1}
      bin_search_rescue: {type: BIN, subtype: BIN_SEARCH_RESCUE, symmetry_deg: 180.0, has_orientation: true, prior: "bin", prior_radius_m: 3.0, max_instances: 2}
      bin_survey_repair: {type: BIN, subtype: BIN_SURVEY_REPAIR, symmetry_deg: 180.0, has_orientation: true, prior: "bin", prior_radius_m: 3.0, max_instances: 2}
      bin_structure: {type: BIN, subtype: BIN_STRUCTURE, symmetry_deg: 180.0, has_orientation: true, prior: "bin", prior_radius_m: 3.0, max_instances: 1}
      path_marker: {type: PATH_MARKER, subtype: PATH_MARKER_WHOLE, symmetry_deg: 0.0, has_orientation: true, prior: "", prior_radius_m: 5.0, max_instances: 0}
      table: {type: TABLE, subtype: TABLE_WHOLE, symmetry_deg: 180.0, has_orientation: true, prior: "octagon", prior_radius_m: 3.0, max_instances: 1}
      octagon: {type: OCTAGON, subtype: OCTAGON_WHOLE, symmetry_deg: 360.0, has_orientation: false, prior: "octagon", prior_radius_m: 3.0, max_instances: 1}
