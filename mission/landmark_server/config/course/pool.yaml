# Where the tasks are in a real pool, env:=pool. What the tasks look like:
# course/templates.yaml.
#
# Course frame: origin at the gate centre, x through the gate (away from the
# start), y right, z down. prior [x, y, yaw_deg]: where the task's frame is
# (+X out of the front of the prop).
#
# MEASURE every prior (tape, or from the competition map) and the start, then
# enable. List only the tasks that are in the water: the map holds exactly
# their parts. A prior known worse than the template's region_radius_m (2.5 m
# for most props) needs its own, about 2 x the error of the measurement:
#   torpedo: {template: torpedo_board, prior: [...], region_radius_m: 4.0}
# Off: every class is mapped as a free landmark (no gate yaw, no openings).
/**:
  ros__parameters:
    course:
      enable: false
      start: [-4.0, 0.0]  # MEASURE
      tasks:  # MEASURE (these are the simulator's)
        gate:     {template: gate,          prior: [0.000, 0.000, 180.0]}
        slalom_1: {template: slalom_set,    prior: [4.101, 0.362, 0.0]}
        slalom_2: {template: slalom_set,    prior: [6.105, 0.957, 0.0]}
        slalom_3: {template: slalom_set,    prior: [8.107, -0.043, 0.0]}
        torpedo:  {template: torpedo_board, prior: [13.043, -5.187, 180.0]}
        bins:     {template: bins,          prior: [12.544, 4.223, 0.0]}
        table:    {template: table,         prior: [15.254, 0.130, 0.0]}
        octagon:  {template: octagon,       prior: [15.254, 0.131, 0.0]}
