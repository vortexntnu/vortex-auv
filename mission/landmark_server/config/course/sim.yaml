# Course layout of the simulator's RoboSub course (Stonefish robosub scene),
# loaded with env:=sim. From the course meshes (robosub_dummy_publisher
# course_layout.py has the numbers); every value is right for the simulator
# only. A pool or competition needs its own file (config/course/pool.yaml).
#
# Course frame: origin at the gate centre, x through the gate (away from the
# start), y right, z down. A task's frame: +X out of the front of the prop,
# +Y right as seen from the prop, +Z down; prior [x, y, yaw_deg] is where the
# task frame is in the course frame.
#
# The map holds exactly the parts listed here (one landmark per part); a
# detection of one of these classes far from every task is dropped before
# the tracker. Classes in no template (table items, path markers) are mapped
# as free landmarks with the rules in `classes`.
/**:
  ros__parameters:
    course:
      enable: true
      # The vehicle starts 4 m before the gate (where set_course_frame is
      # called; the frame moves to the gate when the gate locks it).
      start: [-4.000, 0.017]
      extra_tracks_per_kind: 2
      variant_votes: 40
      variant_ratio: 3.0
      min_slot_gate_m: 0.2
      # The lane: the area this layout covers (every task's region and the
      # start) plus this margin, turned and moved with the tasks found.
      # Detections outside are dropped before the tracker. Replaces the
      # course_frame.lane boxes while a layout is loaded.
      lane_margin_m: 2.0
      # The layout is turned at most this much to fit the tasks found (a
      # gate yaw estimated a few degrees off turns everything far away).
      max_align_deg: 20.0
      min_class_agreement: 0.5
      # A track fills a part only after this many detections (a part is
      # kept for the whole run).
      min_part_detections: 8
      # Classes a detector mixes up: tracked as one kind, the class comes
      # from the template (or the votes where the template allows several).
      # Only for parts of a kind that stand well apart (> ~1 m): the tracker
      # would mix up the detections of two parts of one kind closer than
      # the detector's noise. The torpedo icons (0.25-0.5 m apart) stay
      # separate classes: an icon reported as another one makes a track that
      # fits no part, and is ignored.
      class_groups:
        slalom_pipes: [SLALOM_PIPE_WHITE, SLALOM_PIPE_RED]
        gate_panels: [GATE_SEARCH_RESCUE, GATE_SURVEY_REPAIR]
        bin_roles: [BIN_SEARCH_RESCUE, BIN_SURVEY_REPAIR]
        table_baskets: [TABLE_BASKET_SEARCH_RESCUE, TABLE_BASKET_SURVEY_REPAIR]
        octagon_images: [OCTAGON_IMAGE_REPAIR, OCTAGON_IMAGE_RESCUE,
                         OCTAGON_IMAGE_SEARCH, OCTAGON_IMAGE_SURVEY]
      templates:
        # Task 1: the gate with its two role panels (which side is which is
        # drawn per run: the votes decide), the outer posts and the short
        # post between the openings. Left/right as the vehicle comes from
        # the start (the gate's front faces the start: task yaw 180).
        gate:
          sigma: [0.2, 0.2, 0.3]
          members:
            whole: {class: GATE_WHOLE, offset: [0.000, 0.000, 0.000]}
            panel_left: {class: [GATE_SEARCH_RESCUE, GATE_SURVEY_REPAIR], offset: [0.023, 0.771, -0.445]}
            panel_right: {class: [GATE_SEARCH_RESCUE, GATE_SURVEY_REPAIR], offset: [0.023, -0.788, -0.445]}
            pole_right: {class: GATE_POLE_EDGE, offset: [0.000, -1.546, 0.032]}
            pole_left: {class: GATE_POLE_EDGE, offset: [0.000, 1.552, 0.032]}
            pole_middle: {class: GATE_POLE_MIDDLE, offset: [0.015, 0.002, -0.258]}
        # Task 2: a slalom set, white-red-white 60" (1.52 m) apart across the
        # course. The drawing is followed to ~0.07 m; the detector's range is
        # off by 0.2-0.3 m up close.
        slalom_set:
          sigma: [0.2, 0.2, 0.3]
          members:
            white_left: {class: SLALOM_PIPE_WHITE, offset: [0.0, -1.52, 0.0]}
            red: {class: SLALOM_PIPE_RED, offset: [0.0, 0.0, 0.0]}
            white_right: {class: SLALOM_PIPE_WHITE, offset: [0.0, 1.52, 0.0]}
        # Task 4: the torpedo board and its icons, one variant per decal
        # version (the icons swap places; the fit and then the votes
        # decide). The openings
        # are derived from the icons (rules.torpedo_targets_from_icons).
        # The parts are named after version 1 (course_state shows the class
        # each has now).
        torpedo_board:
          sigma: [0.15, 0.06, 0.06]
          variants:
            version_1:
              members:
                board: {class: TORPEDO_BOARD_WHOLE, offset: [0.0, 0.0, 0.0]}
                fire: {class: TORPEDO_ICON_FIRE, offset: [0.000, 0.206, -0.214]}
                firetruck: {class: TORPEDO_ICON_FIRETRUCK, offset: [0.000, -0.186, -0.193]}
                blood: {class: TORPEDO_ICON_BLOOD, offset: [0.000, -0.219, 0.058]}
                ambulance: {class: TORPEDO_ICON_AMBULANCE, offset: [0.000, 0.182, 0.202]}
            version_2:
              members:
                board: {class: TORPEDO_BOARD_WHOLE, offset: [0.0, 0.0, 0.0]}
                blood: {class: TORPEDO_ICON_BLOOD, offset: [0.000, 0.210, -0.222]}
                ambulance: {class: TORPEDO_ICON_AMBULANCE, offset: [0.000, -0.178, -0.204]}
                fire: {class: TORPEDO_ICON_FIRE, offset: [0.000, -0.213, 0.056]}
                firetruck: {class: TORPEDO_ICON_FIRETRUCK, offset: [0.000, 0.183, 0.183]}
        # Task 3: the bin rig, the four bins as the front camera sees them
        # (no role), and the role icon on the floor of each (down camera;
        # which bin has which role is drawn per run: the votes decide).
        bins:
          sigma: [0.15, 0.15, 0.3]
          members:
            rig: {class: BIN_STRUCTURE, offset: [0.000, 0.000, 0.000]}
            bin_1: {class: BIN_UNCLASSIFIED, offset: [0.515, 0.028, -0.386]}
            bin_2: {class: BIN_UNCLASSIFIED, offset: [0.015, -0.484, -0.317]}
            bin_3: {class: BIN_UNCLASSIFIED, offset: [0.016, 0.531, -0.148]}
            bin_4: {class: BIN_UNCLASSIFIED, offset: [-0.496, 0.015, -0.115]}
            role_1: {class: [BIN_SEARCH_RESCUE, BIN_SURVEY_REPAIR], offset: [0.515, 0.028, -0.247]}
            role_2: {class: [BIN_SEARCH_RESCUE, BIN_SURVEY_REPAIR], offset: [0.015, -0.484, -0.178]}
            role_3: {class: [BIN_SEARCH_RESCUE, BIN_SURVEY_REPAIR], offset: [0.016, 0.531, -0.009]}
            role_4: {class: [BIN_SEARCH_RESCUE, BIN_SURVEY_REPAIR], offset: [-0.496, 0.015, 0.025]}
        # Task 5: the table with its two baskets (roles drawn per run). The
        # items on it are moved during the run: free landmarks, not parts.
        table:
          sigma: [0.15, 0.15, 0.3]
          members:
            table: {class: TABLE_WHOLE, offset: [0.000, 0.000, 0.000]}
            basket_1: {class: [TABLE_BASKET_SEARCH_RESCUE, TABLE_BASKET_SURVEY_REPAIR], offset: [0.010, 0.393, 0.027]}
            basket_2: {class: [TABLE_BASKET_SEARCH_RESCUE, TABLE_BASKET_SURVEY_REPAIR], offset: [0.011, -0.395, 0.027]}
        # Task 5: the octagon floating over the table and its four image
        # plates (which image is where is drawn per run).
        octagon:
          sigma: [0.2, 0.2, 0.3]
          members:
            octagon: {class: OCTAGON_WHOLE, offset: [0.000, 0.000, 0.000]}
            plate_1: {class: [OCTAGON_IMAGE_REPAIR, OCTAGON_IMAGE_RESCUE, OCTAGON_IMAGE_SEARCH, OCTAGON_IMAGE_SURVEY], offset: [1.296, -0.001, 0.243]}
            plate_2: {class: [OCTAGON_IMAGE_REPAIR, OCTAGON_IMAGE_RESCUE, OCTAGON_IMAGE_SEARCH, OCTAGON_IMAGE_SURVEY], offset: [-0.917, 0.916, 0.243]}
            plate_3: {class: [OCTAGON_IMAGE_REPAIR, OCTAGON_IMAGE_RESCUE, OCTAGON_IMAGE_SEARCH, OCTAGON_IMAGE_SURVEY], offset: [0.000, -1.297, 0.243]}
            plate_4: {class: [OCTAGON_IMAGE_REPAIR, OCTAGON_IMAGE_RESCUE, OCTAGON_IMAGE_SEARCH, OCTAGON_IMAGE_SURVEY], offset: [0.917, 0.916, 0.243]}
      # Where each task is (course frame) and how sure we are of it.
      # region_radius_m: parts are taken this far from the prior (moved by
      # the offset of the nearest task already placed); part_radius_m: after
      # placing, this far from where the template puts a part; min_parts:
      # parts needed to place it (1: the part alone, at the prior yaw);
      # max_range_m: detections of its parts farther from the vehicle are
      # not taken: only for small parts (icons), whose far detections are
      # noisy and biased. Large props are found from afar.
      tasks:
        gate: {template: gate, prior: [0.0, 0.0, 180.0], region_radius_m: 3.0,
               part_radius_m: 1.0, yaw_window_deg: 30.0, min_parts: 2}
        slalom_1: {template: slalom_set, prior: [4.101, 0.362, 0.0], region_radius_m: 1.5,
                    part_radius_m: 0.8, yaw_window_deg: 20.0, symmetric: true, min_parts: 3,
                    max_range_m: 7.0}
        slalom_2: {template: slalom_set, prior: [6.105, 0.957, 0.0], region_radius_m: 1.2,
                    part_radius_m: 0.8, yaw_window_deg: 20.0, symmetric: true, min_parts: 3,
                    max_range_m: 7.0}
        slalom_3: {template: slalom_set, prior: [8.107, -0.043, 0.0], region_radius_m: 1.2,
                    part_radius_m: 0.8, yaw_window_deg: 20.0, symmetric: true, min_parts: 3,
                    max_range_m: 7.0}
        torpedo: {template: torpedo_board, prior: [13.043, -5.187, 180.0], region_radius_m: 2.5,
                 part_radius_m: 0.5, yaw_window_deg: 30.0, min_parts: 3,
                 max_range_m: 6.0}
        bins: {template: bins, prior: [12.544, 4.223, 0.0], region_radius_m: 2.5,
                 part_radius_m: 0.6, yaw_window_deg: 30.0, min_parts: 2}
        table: {template: table, prior: [15.254, 0.130, 0.0], region_radius_m: 2.5,
                 part_radius_m: 1.0, yaw_window_deg: 45.0, symmetric: true, min_parts: 1}
        octagon: {template: octagon, prior: [15.254, 0.131, 0.0], region_radius_m: 2.5,
                 part_radius_m: 1.5, yaw_window_deg: 45.0, min_parts: 1}
