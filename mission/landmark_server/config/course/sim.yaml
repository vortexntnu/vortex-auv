# Where the tasks are in the simulator's RoboSub course (Stonefish robosub
# scene, robosub_dummy_publisher course_layout.py), env:=sim. What the tasks
# look like: course/templates.yaml.
#
# Course frame: origin at the gate centre, x through the gate (away from the
# start), y right, z down. prior [x, y, yaw_deg]: where the task's frame is
# (+X out of the front of the prop). A task can set its own tolerances (the
# keys listed in templates.yaml); here they all come from the templates.
#
# The map holds exactly the parts of these tasks; a detection of one of their
# classes far from every task is dropped before the tracker.
/**:
  ros__parameters:
    course:
      enable: true
      # Where the vehicle starts (set_course_frame is called there; the frame
      # moves to the gate when the gate locks it).
      start: [-4.000, 0.017]
      tasks:
        gate:     {template: gate,          prior: [0.000, 0.000, 180.0]}
        slalom_1: {template: slalom_set,    prior: [4.101, 0.362, 0.0]}
        slalom_2: {template: slalom_set,    prior: [6.105, 0.957, 0.0]}
        slalom_3: {template: slalom_set,    prior: [8.107, -0.043, 0.0]}
        torpedo:  {template: torpedo_board, prior: [13.043, -5.187, 180.0]}
        bins:     {template: bins,          prior: [12.544, 4.223, 0.0]}
        table:    {template: table,         prior: [15.254, 0.130, 0.0]}
        octagon:  {template: octagon,       prior: [15.254, 0.131, 0.0]}
