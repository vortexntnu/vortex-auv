# Simulator (Stonefish RoboSub course), env:=sim (the default). What a real
# pool measures (pool.yaml), here from the simulator's scene and from
# drift_injector.py (config/drift/). Right for the simulator only.
/**:
  ros__parameters:
    rules:
      # The pool floor and the water surface (odom z, down positive).
      z_lock: {enable: true, floor_z: 3.432, surface_z: 0.0}
      # The table top above the floor.
      table_octagon: {table_height_m: 0.715}

    # How far off a detection is at range d: std base + along_std_per_m * d
    # along the line of sight, base + across_std_per_m * d across it. Used by
    # the tracker and the graph. Measured against the true objects (dummy
    # publisher, unstable profile, plus the injector's camera noise).
    detector_noise: {base_std_m: 0.06, along_std_per_m: 0.03, across_std_per_m: 0.003}

    # Odometry drift (the simulator's own odometry does not drift;
    # drift_injector.py makes it drift like an IMU + DVL estimator). Std of
    # one keyframe step, twice the realistic profile so the worst still fits:
    # 0.045-0.07 per m moving, 2 cm per step hovering. The heading drift is
    # mostly a gyro bias (5-23 deg/h), so the yaw noise is per second, not per
    # metre (with 1 deg/m the landmark noise turned the whole map).
    # Remembered landmarks with no / realistic / worst drift: 0.06 / 0.12 /
    # 0.14 m (without the graph 0.05 / 0.19 / 0.39 m).
    graph:
      odom_noise: {pos_std_per_m: 0.12, min_pos_std_m: 0.04,
                   yaw_std_deg_per_m: 0.06, yaw_std_deg_per_sec: 0.02}
