# A real pool, env:=pool. Every value here is measured in the pool; until
# then they are the simulator's values or guesses, marked MEASURE. The tests
# (A-D) and how to turn them into numbers: README, "Measuring a pool".
/**:
  ros__parameters:
    rules:
      # MEASURE: the pool floor depth in odom z (down positive). Off until
      # then: a wrong floor depth moves the bins and the path markers.
      z_lock: {enable: false, floor_z: 3.432, surface_z: 0.0}
      # MEASURE: the table top above the floor (handbook ~0.7 m).
      table_octagon: {table_height_m: 0.7}

    # MEASURE (test C, and the range bias from test D): how far off a
    # detection is at range d. Std base + along_std_per_m * d along the line
    # of sight, base + across_std_per_m * d across it. Used by the tracker and
    # the graph.
    detector_noise: {base_std_m: 0.06, along_std_per_m: 0.03, across_std_per_m: 0.003}

    # MEASURE: odometry drift. Std of one keyframe step: about 2 x the
    # measured drift (the drift is a bias, not independent steps).
    graph:
      odom_noise:
        yaw_std_deg_per_m: 1.0      # 2 x yaw drift per metre (test A)
        pos_std_per_m: 0.02         # 2 x DVL scale error (test A)
        yaw_std_deg_per_sec: 0.01   # yaw drift per second in hover (test B)
        # Position drift per keyframe (~5 s) in hover (test B). Too small
        # (with pos_std_per_m) makes the graph turn the vehicle to explain
        # position drift: in the simulator both needed 0.04-0.12 (sim.yaml).
        min_pos_std_m: 0.01
