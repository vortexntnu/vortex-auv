# Prior map (use_prior_map: true): the start pose and the expected landmark
# poses in the map (pool) frame. Same axes as odom: x forward at yaw 0,
# z down (depth), yaw in radians.
#
# initial_pose: where the vehicle is at startup / mission/wipe. Its sigmas
#   are how well the start position and heading are known. Leave z out to
#   use the pressure depth (odom z) as the map z.
# landmarks: where the objects should be: class (a key of
#   landmark_classes.yaml), x, y, optional sigma_xy (else
#   default_prior_sigma_xy). They do not pull the map (a prior with an error
#   per task would bend it); a vote for a new landmark of a class listed here
#   is only taken within 3 sigma_xy + vote_radius_m of one of its entries:
#   a false detection far from where the object can be (a gate post taken for
#   a slalom pipe) never becomes a landmark. sigma_xy: how far the object can
#   be from the drawing.
#
# Example entries:
#   - {class: gate_search_rescue, x: 4.0, y: 0.8, sigma_xy: 0.5}
#   - {class: slalom_pipe_red, x: 8.1, y: 0.3, sigma_xy: 0.5}
initial_pose: {x: 0.0, y: 0.0, yaw: 0.0, sigma_xy: 0.5, sigma_yaw: 0.3}
landmarks: []
